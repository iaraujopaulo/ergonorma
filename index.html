<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ErgoNorma</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Plataforma de análise ergonômica com NR 17 e NR 01: AEP, AET, PGR, RULA, REBA, NIOSH, OCRA, TOR-TOM e outras ferramentas com dashboards e relatórios.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,650;12..96,750&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link id="bs-cdn" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link id="app-css" href="css/app.css" rel="stylesheet">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Menu de ferramentas">
    <div class="side-brand">
      <a href="#inicio" class="brand-link" aria-label="ErgoNorma, página inicial">
        <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true"><path d="M6 38a18 18 0 0 1 36 0" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M24 38 35 17" stroke="var(--signal)" stroke-width="4" stroke-linecap="round"/><circle cx="24" cy="38" r="4.5" fill="currentColor"/></svg>
        <span><b>ErgoNorma</b><small>NR 17 · NR 01</small></span>
      </a>
      <button class="btn-icon d-lg-none" id="sideClose" type="button" aria-label="Fechar menu"><i data-lucide="x"></i></button>
    </div>
    <div class="side-search">
      <i data-lucide="search"></i>
      <input id="menuSearch" type="search" placeholder="Buscar ferramenta…" aria-label="Buscar ferramenta" autocomplete="off">
    </div>
    <nav id="menu" class="menu"></nav>
    <div class="side-foot">
      <button class="side-theme" id="themeToggle" type="button"><i data-lucide="moon"></i><span>Alternar tema</span></button>
    </div>
  </aside>
  <div class="side-backdrop" id="sideBackdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="btn-icon d-lg-none" id="sideOpen" type="button" aria-label="Abrir menu"><i data-lucide="menu"></i></button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-actions">
        <a class="btn btn-sm btn-ghost" href="#todas"><i data-lucide="layout-grid"></i><span class="d-none d-md-inline">Ferramentas A–Z</span></a>
        <a class="btn btn-sm btn-ghost" href="#historico"><i data-lucide="history"></i><span class="d-none d-md-inline">Histórico</span></a>
      </div>
    </header>
    <main id="view" class="content" tabindex="-1"></main>
    <footer class="foot">
      <span>ErgoNorma · Ferramentas de apoio à análise ergonômica conforme NR 17 (Ergonomia) e NR 01 (GRO/PGR).</span>
      <span>Os resultados apoiam, e não substituem, o julgamento técnico do profissional responsável.</span>
    </footer>
  </div>
</div>

<div id="reportView" class="report-view" hidden>
  <div class="report-toolbar">
    <strong id="reportTitle">Relatório</strong>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-sm btn-primary" id="rpPrint" type="button"><i data-lucide="printer"></i> Imprimir / PDF</button>
      <button class="btn btn-sm btn-outline-light" id="rpDownload" type="button"><i data-lucide="download"></i> Baixar HTML</button>
      <button class="btn btn-sm btn-outline-light" id="rpCopy" type="button"><i data-lucide="copy"></i> Copiar texto</button>
      <button class="btn btn-sm btn-light" id="rpClose" type="button"><i data-lucide="x"></i> Fechar</button>
    </div>
  </div>
  <div class="report-scroll"><article id="reportPaper" class="report-paper"></article></div>
</div>

<div id="toast" class="toast-msg" role="status" aria-live="polite" hidden></div>

<script>
/* Bootstrap: usa a CDN e, se ela não carregar, a cópia local em vendor/ */
(function () {
  function check() {
    var t = document.createElement('div'); t.className = 'd-none'; document.body.appendChild(t);
    var ok = getComputedStyle(t).display === 'none'; t.remove();
    if (!ok && !document.getElementById('bs-local')) {
      var l = document.createElement('link'); l.id = 'bs-local'; l.rel = 'stylesheet'; l.href = 'vendor/bootstrap.min.css';
      document.head.insertBefore(l, document.getElementById('app-css'));
    }
  }
  if (document.readyState === 'complete') check(); else window.addEventListener('load', check);
  setTimeout(check, 2500);
})();
</script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/core.js"></script>
<script src="js/tools-gestao.js"></script>
<script src="js/tools-biomecanica.js"></script>
<script src="js/tools-cargas.js"></script>
<script src="js/tools-membros.js"></script>
<script src="js/tools-psico.js"></script>
<script src="js/tools-triagem.js"></script>
<script src="js/app.js"></script>
</body>
</html>
