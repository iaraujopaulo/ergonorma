<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TOR-TOM · Membros superiores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script>/* fallback local do Bootstrap quando a CDN não carregar */
window.addEventListener('DOMContentLoaded',function(){var t=document.createElement('div');t.className='d-none';document.body.appendChild(t);
if(getComputedStyle(t).display!=='none'){var l=document.createElement('link');l.rel='stylesheet';l.href='../../vendor/bootstrap.min.css';var st=document.querySelector('link[href="style.css"]');st.parentNode.insertBefore(l,st);}t.remove();});</script>
<link href="style.css" rel="stylesheet">
</head>
<body>
<div id="shell">
  <header id="appbar" class="d-none">
    <button id="btnBack" class="icon-btn" aria-label="Voltar">&#8592;</button>
    <div id="appTitle"></div>
    <button id="avatar" class="avatar-btn" aria-label="Ver imagem e vídeo da atividade"></button>
    <div id="prog"><i></i></div>
  </header>
  <main id="app"></main>
  <footer id="bottom" class="d-none">
    <div id="bottomLabel"></div>
    <div class="bar">
      <button id="btnPrev" class="btn nav-btn" aria-label="Etapa anterior">&#8592;</button>
      <button id="btnNext" class="btn nav-btn" aria-label="Próxima etapa">&#8594;</button>
    </div>
  </footer>
</div>
<div id="overlay" class="d-none"></div>
<script src="brand.js"></script>
<script src="dados.js"></script>
<script src="app.js"></script>
</body>
</html>
